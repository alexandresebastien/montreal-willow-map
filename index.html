<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montreal Willow Trees</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    @font-face {
  font-family: 'PP Neue Montreal';
  src: url('fonts/PPNeueMontreal-Regular.otf') format('opentype');
  font-weight: 400;
}

@font-face {
  font-family: 'PP Neue Montreal';
  src: url('fonts/PPNeueMontreal-Semibold.otf') format('opentype');
  font-weight: 600;
}

@font-face {
  font-family: 'PP Neue Montreal';
  src: url('fonts/PPNeueMontreal-Extrabold.otf') format('opentype');
  font-weight: 800;
}
    @font-face {
  font-family: 'PP Neue Montreal Mono';
  src: url('fonts/PPNeueMontrealMono-Bold.otf') format('opentype');
  font-weight: 700;
}
    body {
  margin: 0;
font-family: 'PP Neue Montreal', sans-serif;
  font-weight: bold;
  background: #f7f6f0;
  color: #354638;
}

   header p {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-weight: normal;
  color: #687767;
}

   h1 {
  margin: 0 0 8px;
  font-size: 30px;
  font-weight: bold;
  font-family: Helvetica, Arial, sans-serif;
}

    header p {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #687767;
    }

    #map {
      width: 100%;
      height: 75vh;
    }

   .popup p {
  margin: 5px 0;
  font-size: 13px;
  font-weight: normal;
}

    .popup h3 {
      margin: 0 0 8px;
      color: #354638;
    }

    .popup p {
      margin: 5px 0;
      font-size: 13px;
    }

    .popup video {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Willow Trees of Montreal</h1>
    <p>A collection of trees, mapped through video</p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([45.50, -73.60], 11);

   L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri'
}).addTo(map);

    fetch('trees.json')
      .then(response => response.json())
      .then(trees => {
        trees.forEach(tree => {
          const popup = `
            <div class="popup">
              <h3>${tree.name}</h3>
              <p><strong>Collected:</strong> ${tree.date || 'Date unavailable'}</p>
              <p><strong>Location:</strong> ${tree.lat.toFixed(5)}, ${tree.lng.toFixed(5)}</p>
              ${tree.video ? `
  <iframe
    width="260"
    height="146"
    src="https://www.youtube-nocookie.com/embed/${tree.video}"
    title="Willow tree video"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
` : '<p><em>Video coming soon.</em></p>'}
            </div>
          `;

          L.marker([tree.lat, tree.lng])
            .addTo(map)
            .bindPopup(popup);
        });

        if (trees.length) {
          const bounds = L.latLngBounds(
            trees.map(tree => [tree.lat, tree.lng])
          );
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      })
      .catch(error => console.error('Could not load tree data:', error));
  </script>
</body>
</html>
